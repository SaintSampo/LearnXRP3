<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LearnXRP · Home</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='M38 4h-9L2 36h9z' fill='%230A6EFF'/%3E%3Cpath d='M2 4h9l27 32h-9z' fill='%23D1182C'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<style>
.today{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);padding:16px 24px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;margin-bottom:24px}
.today .done{display:flex;gap:16px;font-size:13px;color:var(--color-text-muted);margin-top:4px;flex-wrap:wrap}
.today .done b{font-weight:600;color:var(--color-success)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hd h2{font-size:26px}
.sub{color:var(--color-text-muted);font-size:14px;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.ap{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;text-align:start;font:inherit;color:inherit;cursor:pointer;transition:all .2s ease;border:0;padding:0;text-decoration:none}
.ap:hover{box-shadow:var(--shadow-md);transform:translateY(-3px)}
.ap .thumb{height:118px;background:var(--color-surface-2);display:block;position:relative}
.ap .thumb svg{width:100%;height:100%;display:block}
.ap .where{position:absolute;inset-inline-start:10px;bottom:8px;background:rgba(31,58,85,.9);color:#fff;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.ap .body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ap h3{font-size:17px}
.ap .does{font-size:13px}
.ap .kv{display:grid;grid-template-columns:78px 1fr;gap:3px 8px;font-size:12px;color:var(--color-text-muted);margin-top:4px}
.ap .kv b{font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:10px;padding-top:2px}
.ap .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:8px}
.ap.locked{opacity:.6;cursor:not-allowed}
@media (max-width:900px){.today{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="ribbon" class="rb"></header>
<main class="band" style="flex:1">
  <div class="today">
    <span id="ring"></span>
    <div><span class="eyebrow" id="today-eyebrow"></span><div style="font-weight:600;font-size:17px" id="today-line"></div><div class="done"><span><b>✓</b> <span data-i18n="warmup">Warm-up quiz</span></span><span data-i18n="dueFri">Due Friday</span><span data-i18n="opensIn">Opens in Blocks Lab (XRPCode)</span></div></div>
    <a class="btn btn-primary" href="app.html?app=xrpcode" data-i18n="continueLesson">Continue lesson</a>
  </div>
  <div class="hd"><div><h2 data-i18n="apps">Apps</h2><div class="sub" data-i18n="appsSub">Every card says where it opens, what you do there, and what you need.</div></div><a class="btn btn-out" href="index.html?new=1" data-i18n="joinCode">Join with a code</a></div>
  <div class="cards" id="cards"></div>
</main>
<footer class="footer" data-footer></footer>
<script src="assets/shell.js"></script>
<script>
const S=LX.S,t=LX.t;
if(S.role==='guest'&&!S.name){location.replace('index.html')}
const st=LX.LESSON.steps[S.step-1];
LX.ribbon({crumb:`<b>${t('home')}</b>`});
document.getElementById('ring').innerHTML=LX.ringSvg((S.doneSteps||[]).length,7);
document.getElementById('today-eyebrow').innerHTML=LX.XMARK('#D1182C','#0A6EFF')+' '+(S.classCode?t('todayIn',{c:S.className}):t('home'));
document.getElementById('today-line').textContent=t('lessonLine',{s:S.step,t:st.t});
document.getElementById('cards').innerHTML=LX.APPS.map(a=>{const need=a.needs==='robot'?`<span class="pill blue"><i></i>${t('needsRobot')}</span>`:`<span class="pill green"><i></i>${t('noRobotNeeded')}</span>`;const phone=a.phone?`<span class="pill">${t('phoneOk')}</span>`:'';const tag=a.locked?'button':'a';const href=a.locked?'':`href="app.html?app=${a.id}"`;return `<${tag} class="ap ${a.locked?'locked':''}" ${href} ${a.locked?'disabled':''}><span class="thumb">${LX.THUMBS[a.thumb]}<span class="where">↗ ${a.opens}</span></span><span class="body"><h3>${a.name}</h3><span class="does">${a.does}</span><span class="kv"><b>${t('youNeed')}</b><span>${a.need}</span><b>${t('lastTime')}</b><span>${a.last}</span><b>${t('staysIn')}</b><span>${a.url?t('frame'):'LearnXRP'}</span></span><span class="foot"><span>${a.locked?`<span class="pill red">${t('askTeacher')}</span>`:need+phone}</span>${a.locked?'':`<span class="btn btn-primary sm">${t('open')} ${a.name}</span>`}</span></span></${tag}>`}).join('');
</script>
</body>
</html>
